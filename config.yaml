{
  "report_timezone": "Asia/Shanghai",
  "arxiv": {
    "source": "search",
    "endpoint": "https://export.arxiv.org/api/query",
    "rss_endpoint": "https://rss.arxiv.org/rss",
    "categories": [
      "cs.AI",
      "cs.LG",
      "cs.CL",
      "cs.HC",
      "cs.CV"
    ],
    "search_keywords": [
      "gui agent memory",
      "gui agents memory",
      "gui agent long-term memory",
      "gui agent memory retrieval",
      "gui agent persistent memory",
      "gui agent episodic memory",
      "gui agent external memory",
      "computer use agent memory",
      "computer control agent memory",
      "screen agent memory",
      "screen grounding memory",
      "user interface agent memory",
      "graphical user interface agent memory"
    ],
    "use_keyword_query": true,
    "max_results": 30,
    "per_category_max_results": 10,
    "days_back": 30,
    "sort_by": "submittedDate",
    "sort_order": "descending",
    "timeout_seconds": 90,
    "request_retries": 2,
    "retry_delay_seconds": 30,
    "max_retry_delay_seconds": 60,
    "request_delay_seconds": 10,
    "split_categories": false
  },
  "filters": {
    "require_topic_match": true,
    "min_score": 1,
    "max_papers_per_day": 20
  },
  "outputs": {
    "readme": "README.md",
    "latest_json": "data/latest.json",
    "papers_json": "data/papers.json",
    "archive_dir": "data"
  },
  "llm": {
    "enabled": false,
    "max_papers": 8,
    "language": "Simplified Chinese",
    "model": "gpt-4o-mini",
    "base_url": "https://api.openai.com/v1",
    "timeout_seconds": 45
  },
  "topics": {
    "gui-agent-memory": {
      "display_name": "GUI Agent Memory",
      "keywords": [
        "gui agent memory",
        "gui agents memory",
        "gui agent long-term memory",
        "gui agent memory retrieval",
        "gui agent persistent memory",
        "gui agent episodic memory",
        "gui agent external memory",
        "computer use agent memory",
        "computer control agent memory",
        "screen agent memory",
        "screen grounding memory",
        "user interface agent memory",
        "graphical user interface agent memory"
      ]
    }
  }
}
